<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Soil Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000000);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: white;
}

@keyframes gradientBG {
  0% {background-position:0% 50%}
  50% {background-position:100% 50%}
  100% {background-position:0% 50%}
}

.header {
  text-align: center;
  padding: 20px;
  font-size: 20px;
  letter-spacing: 2px;
}

.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  padding: 30px;
}

.card {
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}

/* ===== Moisture Value Glow ===== */
.value {
  font-size: 60px;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 0 10px #00ffff,
               0 0 20px #00ffff,
               0 0 40px #0072ff;
}

/* ===== Circular Progress ===== */
.circle-container {
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.circle-container svg {
  transform: rotate(-90deg);
}

.circle-text {
  position:absolute;
  font-size:22px;
  font-weight:bold;
}

/* ===== Chart ===== */
canvas {
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 10px;
}
</style>
</head>

<body>

<div class="header">
REAL-TIME SMART FARM DASHBOARD
</div>

<div class="dashboard">

  <!-- Left Card -->
  <div class="card">
    <h2 style="text-align:center;">Soil Moisture</h2>
    <div class="value" id="soilValue">--</div>

    <div class="circle-container">
      <svg width="150" height="150">
        <circle cx="75" cy="75" r="65"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="12"
          fill="none"/>
        <circle id="progressCircle"
          cx="75" cy="75" r="65"
          stroke="#00ffff"
          stroke-width="12"
          fill="none"
          stroke-dasharray="408"
          stroke-dashoffset="408"/>
      </svg>
      <div class="circle-text" id="percentText">0%</div>
    </div>

    <p style="text-align:center;" id="statusText">Connecting...</p>
  </div>

  <!-- Right Card -->
  <div class="card">
    <h2 style="text-align:center;">History Chart</h2>
    <canvas id="historyChart"></canvas>
  </div>

</div>

<script>
const binId = "6996e7a6d0ea881f40c67f49";
const accessKey = "$2a$10$ta1AzT5NM3FCiT095fD2c./QPfPBJ8Licae.mm1Oaq9xAaT2I3RWC";

let historyData = [];
let historyLabels = [];

/* ===== Chart Setup ===== */
const ctx = document.getElementById('historyChart');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: historyLabels,
    datasets: [{
      label: 'Soil Value',
      data: historyData,
      borderColor: '#00ffff',
      backgroundColor: 'rgba(0,255,255,0.2)',
      tension: 0.3,
      fill: true
    }]
  },
  options: {
    responsive:true,
    scales: {
      x: { ticks:{color:'white'} },
      y: { ticks:{color:'white'} }
    },
    plugins:{
      legend:{labels:{color:'white'}}
    }
  }
});

/* ===== Fetch Data ===== */
async function fetchData(){
  try{
    const res = await fetch(
      `https://api.jsonbin.io/v3/b/${binId}/latest`,
      { headers:{ "X-Access-Key": accessKey }, cache:"no-store"}
    );
    const data = await res.json();
    const soil = data.record.soil;

    document.getElementById("soilValue").innerText = soil;

    let percent = mapValue(soil,1500,3500,100,0);
    percent = Math.max(0,Math.min(100,percent));

    updateCircle(percent);
    updateStatus(soil);

    addHistory(soil);

  }catch(e){
    document.getElementById("statusText").innerText="Connection Error";
  }
}

/* ===== Functions ===== */
function mapValue(x,in_min,in_max,out_min,out_max){
  return (x-in_min)*(out_max-out_min)/(in_max-in_min)+out_min;
}

function updateCircle(percent){
  const circle = document.getElementById("progressCircle");
  const circumference = 408;
  const offset = circumference - (percent/100)*circumference;
  circle.style.strokeDashoffset = offset;
  document.getElementById("percentText").innerText =
    percent.toFixed(0) + "%";
}

function updateStatus(soil){
  const status = document.getElementById("statusText");
  if(soil>2400){
    status.innerText="Status: Dry Soil";
    status.style.color="#ff4d4d";
  }else{
    status.innerText="Status: Moist Soil";
    status.style.color="#00ff99";
  }
}

function addHistory(value){
  const now = new Date().toLocaleTimeString();
  historyLabels.push(now);
  historyData.push(value);

  if(historyData.length>20){
    historyData.shift();
    historyLabels.shift();
  }
  chart.update();
}

/* ===== Start ===== */
fetchData();
setInterval(fetchData,2000);

</script>

</body>
</html>
