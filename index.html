<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soil Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f2f2f2;
}

.card {
  margin-top: 80px;
  padding: 30px;
  background: white;
  width: 320px;
  margin: auto;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.value {
  font-size: 45px;
  font-weight: bold;
  margin: 20px 0;
}

.status {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="card">
  <h2>🌱 Soil Moisture Monitor</h2>
  <div id="soilValue" class="value">Loading...</div>
  <div id="status" class="status"></div>
</div>

<script>

const binId = "6996e7a6d0ea881f40c67f49";   // ใส่ Bin ID ของคุณ
const accessKey = "$2a$10$ta1AzT5NM3FCiT095fD2c./QPfPBJ8Licae.mm1Oaq9xAaT2I3RWC";     // ต้องเป็น Access Key (Read Only)

function fetchData() {
  fetch("https://api.jsonbin.io/v3/b/" + binId + "/latest", {
    method: "GET",
    headers: {
      "X-Access-Key": accessKey
    }
  })
  .then(response => {
    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }
    return response.json();
  })
  .then(data => {

    console.log("JSON:", data); // ดูข้อมูลจริงใน Console

    if (!data.record || data.record.soil === undefined) {
      throw new Error("Invalid JSON structure");
    }

    let soil = data.record.soil;

    document.getElementById("soilValue").innerText = soil;

    if (soil > 2400) {
      document.getElementById("status").innerHTML =
        "<span style='color:red;'>ดินแห้ง 💧</span>";
    } else {
      document.getElementById("status").innerHTML =
        "<span style='color:green;'>ดินชื้น ✅</span>";
    }

  })
  .catch(error => {
    console.log("Fetch error:", error);
    document.getElementById("soilValue").innerText = "Error";
    document.getElementById("status").innerText = "";
  });
}

fetchData();
setInterval(fetchData, 5000);

</script>

</body>
</html>
