<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Moisture Monitoring System</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #ffffff;
  width: 420px;
  padding: 35px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  font-size: 20px;
  text-align: center;
  margin-bottom: 20px;
  color: #2c3e50;
}

.time {
  text-align: center;
  font-size: 14px;
  color: #34495e;
  margin-bottom: 15px;
}

.value {
  text-align: center;
  font-size: 48px;
  font-weight: bold;
  color: #2c3e50;
}

.status {
  text-align: center;
  font-size: 16px;
  margin: 15px 0;
}

.bar-container {
  width: 100%;
  height: 12px;
  background: #e0e6ed;
  border-radius: 6px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: #3498db;
  transition: width 0.4s linear;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #95a5a6;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Soil Moisture Monitoring System</h1>

  <div class="time" id="currentTime">--</div>

  <div class="value" id="soilValue">--</div>

  <div class="status" id="statusText">Connecting...</div>

  <div class="bar-container">
    <div class="bar-fill" id="barFill"></div>
  </div>

  <div class="footer">
    Real-Time Monitoring (1 Second Interval)
  </div>
</div>

<script>

const binId = "6996e7a6d0ea881f40c67f49";
const accessKey = "$2a$10$ta1AzT5NM3FCiT095fD2c./QPfPBJ8Licae.mm1Oaq9xAaT2I3RWC";

/* ================= CLOCK ================= */

function updateClock() {
  const now = new Date();

  const day = String(now.getDate()).padStart(2,'0');
  const month = String(now.getMonth()+1).padStart(2,'0');
  const year = now.getFullYear();

  const hours = String(now.getHours()).padStart(2,'0');
  const minutes = String(now.getMinutes()).padStart(2,'0');
  const seconds = String(now.getSeconds()).padStart(2,'0');

  const formatted = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;

  document.getElementById("currentTime").innerText =
    "Current Time: " + formatted;
}

/* ================= FETCH ================= */

async function fetchData() {
  try {

    const res = await fetch(
      `https://api.jsonbin.io/v3/b/${binId}/latest`,
      {
        headers: { "X-Access-Key": accessKey },
        cache: "no-store"
      }
    );

    const data = await res.json();
    const soil = data.record.soil;

    document.getElementById("soilValue").innerText = soil;

    let percent = mapValue(soil, 1500, 3500, 100, 0);
    percent = Math.max(0, Math.min(100, percent));

    document.getElementById("barFill").style.width = percent + "%";

    if (soil > 2400) {
      document.getElementById("statusText").innerText = "Status: Dry Soil";
      document.getElementById("statusText").style.color = "#c0392b";
    } else {
      document.getElementById("statusText").innerText = "Status: Moist Soil";
      document.getElementById("statusText").style.color = "#27ae60";
    }

  } catch (error) {
    document.getElementById("statusText").innerText = "Connection Error";
    document.getElementById("statusText").style.color = "#e67e22";
  }
}

function mapValue(x, in_min, in_max, out_min, out_max) {
  return (x - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
}

/* ================= START ================= */

// 🔥 นาฬิกาเดินตลอด
updateClock();
setInterval(updateClock, 1000);

// 🔥 ดึงข้อมูลทุก 1 วิ
fetchData();
setInterval(fetchData, 1000);

</script>

</body>
</html>
