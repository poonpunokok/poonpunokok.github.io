<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Moisture Monitoring System</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #1f2a38, #2c3e50);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Header */
.header {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 15px 0;
  text-align: center;
  background: rgba(0,0,0,0.2);
  color: #ffffff;
  font-size: 16px;
  letter-spacing: 1px;
}

/* Card */
.container {
  background: #ffffff;
  width: 430px;
  padding: 35px;
  border-radius: 12px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.2);
}

h1 {
  font-size: 20px;
  text-align: center;
  margin-bottom: 20px;
  color: #2c3e50;
}

.time, .viewers {
  text-align: center;
  font-size: 14px;
  color: #34495e;
  margin-bottom: 10px;
}

.value {
  text-align: center;
  font-size: 52px;
  font-weight: bold;
  color: #2c3e50;
}

.status {
  text-align: center;
  font-size: 16px;
  margin: 15px 0;
}

.bar-container {
  width: 100%;
  height: 14px;
  background: #e0e6ed;
  border-radius: 7px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: #2980b9;
  transition: width 0.4s linear;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #7f8c8d;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="header">
  REAL-TIME ENVIRONMENT MONITORING SYSTEM
</div>

<div class="container">
  <h1>Soil Moisture Monitoring</h1>

  <div class="time" id="currentTime">--</div>
  <div class="viewers" id="viewerCount">Online Viewers: 1</div>

  <div class="value" id="soilValue">--</div>

  <div class="status" id="statusText">Connecting...</div>

  <div class="bar-container">
    <div class="bar-fill" id="barFill"></div>
  </div>

  <div class="footer">
    Auto Refresh: 1 Second | Cloud Data Storage
  </div>
</div>

<script>

const binId = "6996e7a6d0ea881f40c67f49";
const accessKey = "$2a$10$ta1AzT5NM3FCiT095fD2c./QPfPBJ8Licae.mm1Oaq9xAaT2I3RWC";

/* ================= CLOCK ================= */
function updateClock() {
  const now = new Date();
  const formatted = now.toLocaleString('th-TH');
  document.getElementById("currentTime").innerText =
    "Current Time: " + formatted;
}

/* ================= VIEWER COUNTER ================= */
function updateViewerCount() {
  let count = localStorage.getItem("viewerCount");
  count = count ? parseInt(count) : 0;
  count++;
  localStorage.setItem("viewerCount", count);
  document.getElementById("viewerCount").innerText =
    "Online Viewers: " + count;
}

window.addEventListener("beforeunload", function() {
  let count = localStorage.getItem("viewerCount");
  count = count ? parseInt(count) : 1;
  count = Math.max(0, count - 1);
  localStorage.setItem("viewerCount", count);
});

/* ================= FETCH DATA ================= */
async function fetchData() {
  try {
    const res = await fetch(
      `https://api.jsonbin.io/v3/b/${binId}/latest`,
      {
        headers: { "X-Access-Key": accessKey },
        cache: "no-store"
      }
    );

    const data = await res.json();
    const soil = data.record.soil;

    document.getElementById("soilValue").innerText = soil;

    let percent = mapValue(soil, 1500, 3500, 100, 0);
    percent = Math.max(0, Math.min(100, percent));

    document.getElementById("barFill").style.width = percent + "%";

    if (soil > 2400) {
      document.getElementById("statusText").innerText = "Status: Dry Soil";
      document.getElementById("statusText").style.color = "#c0392b";
    } else {
      document.getElementById("statusText").innerText = "Status: Moist Soil";
      document.getElementById("statusText").style.color = "#27ae60";
    }

  } catch (error) {
    document.getElementById("statusText").innerText = "Connection Error";
    document.getElementById("statusText").style.color = "#e67e22";
  }
}

function mapValue(x, in_min, in_max, out_min, out_max) {
  return (x - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
}

/* ================= START ================= */
updateClock();
setInterval(updateClock, 1000);

updateViewerCount();

fetchData();
setInterval(fetchData, 1000);

</script>

</body>
</html>
