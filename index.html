<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soil Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f7f9;
    }
    .card {
      background: white;
      padding: 30px;
      margin: 50px auto;
      width: 300px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .value {
      font-size: 40px;
      font-weight: bold;
    }
    .dry {
      color: red;
    }
    .wet {
      color: green;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>🌱 Soil Moisture</h2>
  <div id="value" class="value">Loading...</div>
  <div id="status"></div>
</div>

<script>
const apiURL = "วางURLAppsScriptของคุณ";

function fetchData() {
  fetch(apiURL)
    .then(response => response.json())
    .then(data => {
      let soil = data.soil;
      document.getElementById("value").innerText = soil;

      if (soil > 2400) {
        document.getElementById("status").innerHTML = "<span class='dry'>ดินแห้ง 💧</span>";
      } else {
        document.getElementById("status").innerHTML = "<span class='wet'>ดินชื้น ✅</span>";
      }
    });
}

fetchData();
setInterval(fetchData, 5000);
</script>

</body>
</html>
